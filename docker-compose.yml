services:

  mysql:
    image: mysql:8.0
    container_name: texify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: texify_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: texify-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — used by the Spring Boot app
      - "8025:8025"   # Web UI — http://localhost:8025

  adminer:
    image: adminer:latest
    container_name: texify-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"   # Web UI — http://localhost:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
    driver: local
