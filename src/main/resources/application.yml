spring:
  application:
    name: texify-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:texify_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email

  # Mail — defaults point to MailHog (local dev). Override via env vars for prod.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${SERVER_PORT:9000}

texify:
  mail:
    from: ${MAIL_FROM:contact.papistudio@gmail.com}
  storage:
    local-root-path: ${STORAGE_ROOT:./storage}
    type: ${STORAGE_TYPE:LOCAL}
    base-url: ${STORAGE_BASE_URL:http://localhost:9000/storage}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Landing / showcase mode. When true, the backend only serves the waitlist
  # and health endpoints; every other route returns 404. Default false = full MVP.
  public-mode: ${APP_PUBLIC_MODE:false}

logging:
  level:
    com.texify: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
